<body>
<div style="font-family:Arial,sans-serif;padding:40px">Загрузка дашборда…</div>
<script>
(async()=>{
  let src=await fetch('index-08.html?v=20260915b',{cache:'no-store'}).then(r=>{
    if(!r.ok)throw new Error('index-08.html: '+r.status);
    return r.text();
  });
  const marker='  // AUTHORITATIVE_CURRENT_STATE_08_09_2026_END\n';
  if(!src.includes(marker))throw new Error('Не найден маркер состояния 08.09.2026');

  const patch15=String.raw`
  // AUTHORITATIVE_CURRENT_STATE_15_09_2026_START
  {
    const addNote15=(x,note)=>{
      for(const f of ['m','hrn']){
        const before=String(x[f]||'').trim();
        if(!before.includes(note))x[f]=(before+' '+note).trim();
      }
    };
    const dMatch15=html.match(/const D=(\[.*?\]);\nconst HALF_EXTRA=/s);
    const vMatch15=html.match(/const VACANCIES_SOURCE=(\[.*?\]);\nlet viewMode=/s);
    if(!dMatch15||!vMatch15)throw new Error('Сверка 15.09: не найдены D / VACANCIES_SOURCE');
    let D15=JSON.parse(dMatch15[1]);
    let V15=JSON.parse(vMatch15[1]);

    const vacZ=V15.find(x=>Number(x.regNo)===42) ||
      V15.find(x=>String(x.z||'')==='УпрВнешКомм' && String(x.np||x.f||'').toLowerCase().includes('главн') &&
        /Давыдулин/i.test(String(x.m||'')+' '+String(x.hrn||'')));
    if(!vacZ)throw new Error('Сверка 15.09: не найдена вакансия после Давыдулина');
    const zim=Object.assign({},vacZ,{
      type:'Сотрудник',
      f:'Зимин Александр Александрович',
      alias:'Зимин Александр Александрович',
      state:'Работа',s:'работает',reduction:false,r:1,
      z:'УпрВнешКомм',
      zf:'Бурдуковская Р.З. (Упр. внешних коммуникаций и защиты информации)',
      b:'Отдел сопровождения',d:'Отдел сопровождения',nd:'Отдел сопровождения',
      np:'Главный специалист',
      op:'Старший инспектор',
      od:'10. Управление по развитию цифровых сервисов',
      sec:'Сектор ЦОД',
      o:null,rem:null,hd:'2026-09-14'
    });
    delete zim.remoteMode;
    delete zim.remoteOrder;
    zim.m='Зимин А.А. с 14.09.2026 занял позицию главного специалиста после перевода Давыдулина А.В. на должность заместителя начальника отдела внешних коммуникаций.';
    zim.hrn=(String(vacZ.hrn||vacZ.m||'').trim()+' Зимин А.А. занял позицию с 14.09.2026.').trim();
    V15=V15.filter(x=>x!==vacZ);
    D15.push(zim);

    const volk=D15.find(x=>String(x.f||'').trim()==='Малькова Ольга Игоревна') ||
      D15.find(x=>String(x.f||'').trim()==='Волкова Ольга Игоревна');
    if(!volk)throw new Error('Сверка 15.09: не найдена Малькова/Волкова О.И.');
    volk.f='Волкова Ольга Игоревна';
    volk.alias='Малькова Ольга Игоревна';
    addNote15(volk,'Реестр 15.09.2026: актуальная фамилия — Волкова; прежняя фамилия — Малькова.');

    const bak=D15.find(x=>String(x.f||'').trim()==='Бакунов Вадим Александрович');
    if(!bak)throw new Error('Сверка 15.09: не найден Бакунов В.А.');
    bak.s='работает';
    bak.reduction=false;
    addNote15(bak,'Реестр 15.09.2026: статус сокращения снят; сотрудник продолжает работать.');

    const halfVac15=V15.find(x=>Number(x.r)===0.5 && String(x.z||'').trim()==='Чернышин' &&
      String(x.np||x.f||'').toLowerCase().includes('главн'));
    if(!halfVac15)throw new Error('Сверка 15.09: не найдена вакансия 0,5 Чернышина');
    halfVac15.s='вакансия / сокращение';
    halfVac15.state='Вакансия';
    halfVac15.reduction=true;
    addNote15(halfVac15,'Реестр 15.09.2026: позиция 0,5 отмечена как Табалова (сокращение); управленческое закрепление за Чернышиным сохранено.');

    for(const name of ['Поимцева Екатерина Анатольевна','Фомина Ольга Валентиновна']){
      const x=D15.find(r=>String(r.f||'').trim()===name);
      if(!x)throw new Error('Сверка Центра ЖКХ: не найден '+name);
      x.i='Центр ЖКХ';
      x.project='Центр ЖКХ';
      addNote15(x,'Отдельная рабочая метка: Центр ЖКХ.');
    }

    const dFte15=D15.reduce((s,x)=>s+Number(x.r||0),0);
    const vFte15=V15.reduce((s,x)=>s+Number(x.r||0),0);
    const remote15=D15.filter(x=>x.remoteMode==='дистанционная работа').length;
    const hybrid15=D15.filter(x=>x.remoteMode==='гибридный график').length;
    const redD15=D15.filter(x=>x.reduction===true).length;
    const redV15=V15.filter(x=>x.reduction===true).length;
    const redFte15=D15.filter(x=>x.reduction===true).reduce((s,x)=>s+Number(x.r||0),0)+
      V15.filter(x=>x.reduction===true).reduce((s,x)=>s+Number(x.r||0),0);

    if(D15.length!==137||Math.abs(dFte15-132)>1e-9)throw new Error('Сверка сотрудников 15.09: '+D15.length+' / '+dFte15+' вместо 137 / 132');
    if(V15.length!==8||Math.abs(vFte15-7)>1e-9)throw new Error('Сверка вакансий 15.09: '+V15.length+' / '+vFte15+' вместо 8 / 7');
    if(D15.length+V15.length!==145||Math.abs(dFte15+vFte15-139)>1e-9)throw new Error('Сверка общего штата 15.09 не пройдена');
    if(remote15!==4||hybrid15!==26)throw new Error('Сверка приказа 01-202/26 на 15.09: '+remote15+' / '+hybrid15);
    if(redD15!==17||redV15!==5||Math.abs(redFte15-20)>1e-9)throw new Error('Сверка сокращения 15.09: '+redD15+' сотрудников, '+redV15+' вакансий, '+redFte15+' ставки');

    html=html.replace(/const D=(\[.*?\]);\nconst HALF_EXTRA=/s,'const D='+JSON.stringify(D15)+';\nconst HALF_EXTRA=');
    html=html.replace(/const VACANCIES_SOURCE=(\[.*?\]);\nlet viewMode=/s,'const VACANCIES_SOURCE='+JSON.stringify(V15)+';\nlet viewMode=');
    html=html.replaceAll('актуальность 08.09.2026','актуальность 15.09.2026');
    html=html.replaceAll('финальная сверка 08.09.2026.','финальная сверка 15.09.2026.');
    html=html.replaceAll('Кадровый_дашборд_08-09-2026.xls','Кадровый_дашборд_15-09-2026.xls');
  }
  // AUTHORITATIVE_CURRENT_STATE_15_09_2026_END
`;

  const patchMin=String.raw`
  // MINISTRY_STRUCTURE_15_09_2026_START
  {
    const ministryRules=[
      [1,1,'3. Отдел внутреннего финансового аудита Министерства и контроля подведомственных организаций',null],
      [2,8,'4. Управление информационного планирования и внешних коммуникаций (сектор внешних коммуникаций)','Сектор внешних коммуникаций'],
      [9,13,'5. Управление анализа и мониторинга деятельности органов местного самоуправления и муниципальных организаций','Сектор анализа эффективности муниципальных организаций'],
      [14,15,'6. Финансово-экономическая служба','Сектор бухгалтерского учета и отчетности'],
      [16,17,'6. Финансово-экономическая служба','Сектор экономического анализа'],
      [18,18,'6. Финансово-экономическая служба','Сектор формирования и сопровождения государственных программ'],
      [19,20,'7. Управление государственной гражданской службы и кадровой политики','Отдел государственной гражданской службы'],
      [21,28,'7. Управление государственной гражданской службы и кадровой политики','Сектор делопроизводства'],
      [29,29,'8. Управление содержания территорий','Отдел содержания территорий и мониторинга коммунальной техники'],
      [30,30,'8. Управление содержания территорий','Отдел анализа бюджетов и формирования титульных списков объектов благоустройства'],
      [31,34,'9.  Контрольное управление служебных проверок и инспектирования','Сектор инспектирования'],
      [35,35,'10. Управление по развитию цифровых сервисов','Отдел внедрения и сопровождения проектов'],
      [36,52,'10. Управление по развитию цифровых сервисов','Сектор ЦОД'],
      [53,53,'10. Управление по развитию цифровых сервисов','Сектор ЦОД (Табалова)'],
      [54,64,'10. Управление по развитию цифровых сервисов','Сектор ЦОД'],
      [65,101,'11. Сектор мониторинга и рассмотрения обращений граждан',null],
      [102,103,'12. Управление правового обеспечения и судебно-договорной работы','Отдел правового обеспечения деятельности по обращению с отходами'],
      [104,105,'13. Управление закупок','Сектор материально-технического обеспечения'],
      [106,107,'13. Управление закупок','Отдел контрактной работы'],
      [108,109,'15. Управление по работе с управляющими организациями','Отдел по работе с управляющими организациями'],
      [110,112,'15. Управление по работе с управляющими организациями','Отдел лицензирования'],
      [113,115,'16. Управление благоустройства территорий и фондов капитального ремонта','Отдел по надзору за формированием фондов капитального ремонта'],
      [116,117,'16. Управление благоустройства территорий и фондов капитального ремонта','Отдел благоустройства территорий'],
      [118,120,'18. Управление по обращению с отходами','Отдел по внедрению территориальной схемы обращения с отходами и работе с региональными операторами по обращению с твердыми коммунальными отходами'],
      [121,123,'18. Управление по обращению с отходами','Отдел по вопросам создания объектов обращения с отходами'],
      [124,125,'18. Управление по обращению с отходами','Отдел по работе с инвестиционными и производственными программами в области обращения с твердыми коммунальными отходами'],
      [126,126,'19. Отдел по федеральному государственному экологическому контролю (надзору)',null],
      [127,127,'19. Отдел по федеральному государственному экологическому контролю (надзору)','(Атлас)'],
      [128,130,'20. Сектор нормативов накопления твердых коммунальных отходов',null],
      [131,132,'20. Сектор нормативов накопления твердых коммунальных отходов','Отдел надзора за газовой безопасностью'],
      [133,133,'20. Сектор нормативов накопления твердых коммунальных отходов','Отдел организации и контроля надзорной деятельности'],
      [134,135,'11. Сектор мониторинга и рассмотрения обращений граждан',null],
      [136,141,null,null]
    ];
    const ministryFor=n=>{
      n=Number(n);
      const r=ministryRules.find(a=>n>=a[0]&&n<=a[1]);
      return r?{od:r[2],sec:r[3]}:null;
    };
    const dMin=html.match(/const D=(\[.*?\]);\nconst HALF_EXTRA=/s);
    const vMin=html.match(/const VACANCIES_SOURCE=(\[.*?\]);\nlet viewMode=/s);
    if(!dMin||!vMin)throw new Error('Минчистоты: не найдены D / VACANCIES_SOURCE');
    let DM=JSON.parse(dMin[1]), VM=JSON.parse(vMin[1]);
    let linked=0, unlinked=0;
    for(const x of [...DM,...VM]){
      const m=ministryFor(x.regNo);
      if(m&&m.od){
        x.ministryDept=m.od;
        x.ministrySector=m.sec||null;
        x.od=m.od;
        x.sec=m.sec||null;
        linked++;
      }else{
        x.ministryDept=null;
        x.ministrySector=null;
        if(Number(x.regNo)>=136&&Number(x.regNo)<=141)unlinked++;
      }
    }
    if(linked<130)throw new Error('Минчистоты: заполнено только '+linked+' позиций');
    html=html.replace(/const D=(\[.*?\]);\nconst HALF_EXTRA=/s,'const D='+JSON.stringify(DM)+';\nconst HALF_EXTRA=');
    html=html.replace(/const VACANCIES_SOURCE=(\[.*?\]);\nlet viewMode=/s,'const VACANCIES_SOURCE='+JSON.stringify(VM)+';\nlet viewMode=');

    html=html.replace(/function quickFilter\(v\)\{.*?\n\}/s,
"function quickFilter(v){\n  $('fStatus').value=''; $('fRate').value=''; $('fRemote').value=''; $('fDeputy').value=''; $('fDept').value=''; $('fInternal').value=''; if($('fMinistryDept')) $('fMinistryDept').value=''; $('q').value='';\n  viewMode=(v==='accounted'||v==='0.5'||v==='plan')?'accounted':'rows';\n  if(v==='0.5') $('fRate').value='0.5';\n  else if(v==='remote') $('fRemote').value='да';\n  else if(v==='вакансия'||v==='сокращение') $('fStatus').value=v;\n  render();\n}");

    html=html.replace(/function filtered\(\)\{.*?\n\}/s,
"function filtered(){\n  const q=$('q').value.trim().toLowerCase(), z=$('fDeputy').value, s=$('fStatus').value, r=$('fRate').value, rem=$('fRemote').value, d=$('fDept').value, i=$('fInternal').value, md=$('fMinistryDept')?$('fMinistryDept').value:'';\n  const source=viewMode==='accounted'?[...D,...VACANCIES_SOURCE]:(s==='вакансия'?VACANCIES_SOURCE:(s==='сокращение'||z||d||i||md?[...D,...VACANCIES_SOURCE]:D));\n  return source.filter(x=>(!z||(z==='ЦСТ'?(x.project==='ЦСТ'||x.i==='ЦСТ'):x.z===z))&&(!s||(s==='сокращение'?x.reduction===true:(s==='вакансия'?x.type==='Вакансия':String(x.s||'').toLowerCase()===String(s).toLowerCase())))&&(!r||String(x.r)===r)&&(!d||x.d===d)&&(!i||x.i===i)&&(!md||x.ministryDept===md)&&(!rem||(rem==='да'?String(x.rem||'').toLowerCase()==='да':String(x.rem||'').toLowerCase()!=='да'))&&(!q||[x.f,x.z,x.zf,x.d,x.b,x.i,x.op,x.od,x.sec,x.ministryDept,x.ministrySector,x.np,x.hrn].join(' ').toLowerCase().includes(q)));\n}");

    const enhancer='<script>(function(){'+
      'function byId(id){return document.getElementById(id)};'+
      'var anchor=byId("fInternal")||byId("fDept");'+
      'if(anchor&&!byId("fMinistryDept")){'+
        'var sel=document.createElement("select");sel.id="fMinistryDept";'+
        'var deps=Array.from(new Set([].concat(D,VACANCIES_SOURCE).map(function(x){return x.ministryDept}).filter(Boolean)));'+
        'deps.sort(function(a,b){var na=parseInt(a,10)||999,nb=parseInt(b,10)||999;return na-nb||a.localeCompare(b,"ru")});'+
        'sel.innerHTML="<option value=\\"\\">Все подразделения Минчистоты</option>"+deps.map(function(v){var e=v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\\"/g,"&quot;");return "<option value=\\""+e+"\\">"+e+"</option>"}).join("");'+
        'anchor.insertAdjacentElement("afterend",sel);sel.addEventListener("change",function(){render()});'+
      '}'+
      'var baseRender=render;'+
      'render=function(){baseRender();var tb=byId("tbody");if(!tb)return;var table=tb.closest("table");var hr=table&&table.querySelector("thead tr");if(hr&&!hr.querySelector("[data-ministry-head]")){var th=document.createElement("th");th.setAttribute("data-ministry-head","1");th.textContent="Подразделение Минчистоты";hr.appendChild(th)}var data=viewMode==="rates"?buildRateUnits():filtered();var trs=Array.from(tb.querySelectorAll("tr"));var idx=0;trs.forEach(function(tr){if(tr.querySelector(".empty")){if(tr.firstElementChild)tr.firstElementChild.colSpan=8;return}if(!tr.children.length)return;var x=data[idx++]||{};var td=document.createElement("td");td.className="ministry-cell";var a=x.ministryDept||x.od||"",b=x.ministrySector||x.sec||"";td.textContent=a?(b?a+" / "+b:a):"—";tr.appendChild(td)})};'+
      'render();'+
    '})();<\/script>';
    html=html.replace('</head>','<style>.ministry-cell{min-width:300px;max-width:430px;white-space:normal;line-height:1.35}</style></head>');
    html=html.replace('</body>',enhancer+'</body>');
  }
  // MINISTRY_STRUCTURE_15_09_2026_END
`;

  src=src.replace(marker,patch15+'\n'+patchMin+'\n'+marker);
  document.open();document.write(src);document.close();
})().catch(e=>{
  document.body.innerHTML='<div style="font:16px Arial;padding:30px;color:#991b1b"><b>Ошибка загрузки дашборда</b><br><br>'+String(e.message||e)+'</div>';
});
</script>
</body>
</html>
