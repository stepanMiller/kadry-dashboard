name: Apply remote work order 01-202-26

on:
  push:
    paths:
      - '.github/workflows/apply-remote-order-01-202-26.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply remote and hybrid work list
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  // AUTHORITATIVE_REGISTER_21_08_2026_END\n'
          block = r'''

  // REMOTE_ORDER_01_202_26_START
  {
    const REMOTE_ORDER_NO='01-202/26 от 13.08.2026';
    const remoteOnly=new Set([
      'Баранова Наталия Андреевна',
      'Баркова Елизавета Александровна',
      'Иванова Юлия Борисовна',
      'Трошина Алина Сергеевна'
    ]);
    const hybrid=new Set([
      'Дмитриева Милена Юрьевна',
      'Дробницкая Ольга Андреевна',
      'Егиазарова Стелла Гарриевна',
      'Карасев Олег Робертович',
      'Качалова Наталья Сергеевна',
      'Козин Алексей Юрьевич',
      'Колобкова Ирина Евгеньевна',
      'Комарова Ольга Федоровна',
      'Логинова Юлия Александровна',
      'Малькова Ольга Игоревна',
      'Милосердова Екатерина Николаевна',
      'Муравьев Игорь Викторович',
      'Носова Ксения Анатольевна',
      'Переверзева Екатерина Андреевна',
      'Петрова Юлия Сергеевна',
      'Севостьянова Ольга Владимировна',
      'Семечкина София Андреевна',
      'Сонина Елена Владимировна',
      'Крючков Дмитрий Петрович',
      'Алиева Наталия Леонидовна',
      'Аносинская Светлана Владимировна',
      'Галицкая Ольга Юрьевна',
      'Голеватова Елена Александровна',
      'Дардыкина Наталья Васильевна',
      'Златина Татьяна Николаевна',
      'Картузова Дарья Михайловна'
    ]);
    html=html.replace(/const D=(\[.*?\]);\nconst HALF_EXTRA=/s,(all,json)=>{
      const rows=JSON.parse(json);
      let foundRemote=0,foundHybrid=0;
      for(const x of rows){
        x.rem=null;
        delete x.remoteMode;
        delete x.remoteOrder;
        const name=String(x.f||'').trim();
        if(remoteOnly.has(name)){
          x.rem='да';
          x.remoteMode='дистанционная работа';
          x.remoteOrder=REMOTE_ORDER_NO;
          foundRemote++;
        }else if(hybrid.has(name)){
          // Dashboard KPI historically treats remote/hybrid participants through rem='да'.
          // Exact mode is preserved separately in remoteMode and in the Google Sheet.
          x.rem='да';
          x.remoteMode='гибридный график';
          x.remoteOrder=REMOTE_ORDER_NO;
          foundHybrid++;
        }
      }
      if(foundRemote!==4||foundHybrid!==26) throw new Error('Сверка приказа 01-202/26: найдено '+foundRemote+' дистанционно и '+foundHybrid+' гибридно');
      return 'const D='+JSON.stringify(rows)+';\nconst HALF_EXTRA=';
    });
  }
  // REMOTE_ORDER_01_202_26_END
'''
          if 'REMOTE_ORDER_01_202_26_START' not in s:
              if marker not in s:
                  raise SystemExit('AUTHORITATIVE_REGISTER marker not found')
              s = s.replace(marker, marker + block, 1)
          p.write_text(s, encoding='utf-8')

          cpath = Path('CHANGELOG.md')
          c = cpath.read_text(encoding='utf-8')
          section = '''## 2026-08-24 — дистанционная и гибридная работа по приказу 01-202/26\n\n- приказ от 13.08.2026 № 01-202/26 принят как актуальная замена прежнего перечня;\n- дистанционная работа: 4 сотрудника;\n- гибридный график: 26 сотрудников;\n- прежние отметки дистанционной работы сняты у сотрудников, не вошедших в новый перечень;\n- для KPI дашборда дистанционная и гибридная группы учитываются совместно: 30 сотрудников; точный режим сохранён в поле remoteMode.\n\n'''
          if '## 2026-08-24 — дистанционная и гибридная работа по приказу 01-202/26' not in c:
              anchor = '# История изменений\n\n'
              if anchor not in c:
                  raise SystemExit('CHANGELOG header not found')
              c = c.replace(anchor, anchor + section, 1)
              cpath.write_text(c, encoding='utf-8')

          Path('.github/workflows/apply-remote-order-01-202-26.yml').unlink()
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md .github/workflows/apply-remote-order-01-202-26.yml
          git commit -m "Обновить дистанционную работу по приказу 01-202/26"
          git push
